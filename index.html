<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NHL Pörssi 26–27</title>
<link rel="stylesheet" href="style.css">
<style>
.palk{padding-bottom:12px;}
.palk .rivi{display:flex;flex-wrap:wrap;gap:8px 18px;padding:12px 14px 4px;}
.palk .p{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;}
.palk .info{padding:4px 14px 0;font-size:13px;color:var(--muted);}
</style>
</head>
<body>
<header class="top"><div class="in"><div class="brand">🏒 NHL Pörssi 26–27</div></div></header>
<nav class="nav"><div class="in">
  <a href="./" class="on">Taulukko</a>
  <a href="joukkueet.html">Joukkueet</a>
  <a href="pistekehitys.html">Pistekehitys</a>
  <a href="tilastot.html">Tilastot</a>
  <a href="vammat.html">Vammat</a>
</div></nav>

<main class="wrap">
  <div class="updated" id="paivitetty"></div>
  <div class="card">
    <table>
      <thead><tr>
        <th class="l c-sija">Sija</th>
        <th class="l">Joukkue</th>
        <th class="c-pts">Pisteet</th>
        <th class="c-pp">P/P</th>
        <th class="c-e1">Ero 1.</th>
        <th class="c-es">Ero sijaan</th>
      </tr></thead>
      <tbody id="rivit"><tr><td colspan="6" class="virhe">Ladataan…</td></tr></tbody>
    </table>
  </div>
  <div id="vr"></div>

  <!-- Palkinnot: päivitä summat ja teksti kauden alussa -->
  <div class="card palk">
    <div class="ctitle">🏆 Palkinnot</div>
    <div class="rivi">
      <span class="p"><span class="medal m1">1</span>840 €</span>
      <span class="p"><span class="medal m2">2</span>420 €</span>
      <span class="p"><span class="medal m3">3</span>140 €</span>
    </div>
    <div class="info">28 joukkuetta, voitonjako 60–30–10</div>
  </div>
</main>

<script src="common.js"></script>
<script>
haeData('taulukko').then(function(d) {
  document.getElementById('paivitetty').textContent = 'Päivitetty ' + (d.updatedAt || '-');

  var h = '';
  (d.rows || []).forEach(function(r) {
    var n = parseInt(r.currentRank, 10);
    var sija = n <= 3 ? '<span class="medal m' + n + '">' + n + '</span>'
                      : '<span class="rk">' + esc(r.currentRank) + '</span>';
    var muutos = '';
    if (r.changed && r.previousRank) {
      var ero = parseInt(r.previousRank, 10) - n;
      if (ero > 0) muutos = '<span class="chg up">▲' + ero + '</span>';
      if (ero < 0) muutos = '<span class="chg down">▼' + (-ero) + '</span>';
    }

    // Ero 1. ja Ero sijaan: ykköselle pokaali, muille luku.
    // Sheet voi antaa sarakkeeseen merkin (esim. 🥈); kakkosen ero edelliseen = ero ykköseen.
    var ykkonen = n === 1;
    var e1 = ykkonen ? '🏆' : esc(r.diffFirst || '-');
    var es = r.diffPlace;
    if (ykkonen) es = '-';
    else if (!/^\d+$/.test(String(es || '').trim())) es = (n === 2 ? r.diffFirst : '-');

    h += '<tr><td class="l sija">' + sija + muutos + '</td>';
    h += '<td class="l team"><a href="joukkueet.html?team=' + encodeURIComponent(r.team) + '">' + esc(r.team) + '</a></td>';
    h += '<td class="pts">' + esc(r.points) + '</td>';
    h += '<td>' + esc(r.pp) + '</td>';
    h += '<td>' + e1 + '</td>';
    h += '<td>' + esc(es || '-') + '</td></tr>';
  });
  document.getElementById('rivit').innerHTML = h ||
    '<tr><td colspan="6" class="virhe">Joukkueita ei ole vielä syötetty.</td></tr>';

  var v = d.viikkoraportti;
  if (v) {
    document.getElementById('vr').innerHTML =
      '<div class="card vr"><div class="ctitle">📰 Viikon katsaus<span class="jakso">' + esc(v.jakso) + '</span></div>' +
      '<p><b class="up">📈 Nousijat.</b> ' + esc(v.nousijat) + '</p>' +
      '<p><b class="down">📉 Laskijat.</b> ' + esc(v.laskijat) + '</p>' +
      (v.kuningas ? '<p>' + esc(v.kuningas) + '</p>' : '') + '</div>';
  }
}).catch(function(e) {
  document.getElementById('rivit').innerHTML =
    '<tr><td colspan="6" class="virhe">Datan lataus epäonnistui (' + esc(e.message) + ')</td></tr>';
});
</script>
</body>
</html>
